[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # PERSONAL_BOOKSHELF turns the bookshelf on for Cedric's production builds of this repo.
  # Cloners: delete the PERSONAL_BOOKSHELF line. The template default in src/site.config.ts is off.
  PERSONAL_BOOKSHELF = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# One hop to the current page. No splat that lands on another redirect.
# Overview pages now live on the home page. The fragment is part of the target.
# force: /work/, /study/, /projects/, /blog/, and /photography/ are also directories of pages.
[[redirects]]
  from = "/about"
  to = "/#work"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/#work"
  status = 301
  force = true

