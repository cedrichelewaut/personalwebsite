<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="#9A2400" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Fraud Aid">
  <g transform="rotate(-3 60 62)">
      <!-- Offset flat tint, like a misregistered print layer. Opaque, so the ear slices do not double it where they overlap the head. -->
      <path class="head" d="M 19 58 C 15 44 15 28 21 10 C 22 7.5 25 7.2 27 8.8 L 45 24 C 54 21.5 66 21.8 75 24.5 L 88 15 L 90.4 13.2 L 91.8 20 L 96.8 14.6 L 98.2 21.2 C 101 30 102.5 44 100.5 56 C 106 63 108 73 104 82 C 97 100 79 107.5 61 107.5 S 24 100 17 82 C 13 72 14 64 19 58 Z" transform="translate(4 4)" fill="#F2E3DE" stroke="none"/>
  
      <!-- Main inked outline, heavier. One ear is taller, the other is folded. -->
      <path class="head" d="M 19 58 C 15 44 15 28 21 10 C 22 7.5 25 7.2 27 8.8 L 45 24 C 54 21.5 66 21.8 75 24.5 L 88 15 L 90.4 13.2 L 91.8 20 L 96.8 14.6 L 98.2 21.2 C 101 30 102.5 44 100.5 56 C 106 63 108 73 104 82 C 97 100 79 107.5 61 107.5 S 24 100 17 82 C 13 72 14 64 19 58 Z" stroke-width="4.600"/>
      <!-- Second, thinner pass that drifts off the first and breaks -->
      <path class="head" d="M 19 58 C 15 44 15 28 21 10 C 22 7.5 25 7.2 27 8.8 L 45 24 C 54 21.5 66 21.8 75 24.5 L 88 15 L 90.4 13.2 L 91.8 20 L 96.8 14.6 L 98.2 21.2 C 101 30 102.5 44 100.5 56 C 106 63 108 73 104 82 C 97 100 79 107.5 61 107.5 S 24 100 17 82 C 13 72 14 64 19 58 Z" transform="translate(-2.200 -1.600)" stroke-width="1.400" stroke-dasharray="52 7 26 11 70 9 40 14"/>
  
      <!-- Ear hatching: three strokes on the tall ear, two on the folded one. The ears are animated by suki.js by moving the free points of the .head outline. -->
      <g stroke-width="2.200">
        <g class="hatch" data-side="l"><path d="M25.500 22l5 6M28.500 17.500 35 25M25 30l4 4.500"/></g>
        <g class="hatch" data-side="r"><path d="M92.500 25 89.500 30M96 28.500l-2.500 4"/></g>
      </g>
  
      <!-- A first-aid cross inked on the forehead by hand: equal arms, a little crooked -->
      <g transform="rotate(-9 60.800 46.200)">
        <path d="M60.300 39C61 43.500 60.200 48.500 61.500 53.400" stroke-width="4.600"/>
        <path d="M53.600 45.600C58 46.600 62.500 45.200 68 47.400" stroke-width="4.600"/>
      </g>
  
      <!-- Solid eyes, bigger than before and not quite the same size. They stay put. -->
      <ellipse cx="40" cy="67" rx="5.600" ry="7.200" fill="#9A2400" stroke="none"/>
      <ellipse cx="81.500" cy="65.500" rx="5" ry="6.600" fill="#9A2400" stroke="none"/>
      <circle cx="41.900" cy="64" r="1.800" fill="#fff" stroke="none"/>
      <circle cx="83.300" cy="62.800" r="1.600" fill="#fff" stroke="none"/>
  
      <!-- Cheek hatching: three on the left, two on the right -->
      <g stroke-width="2">
        <path d="M26 80l3.500-6M30.500 81.500l3.500-6M35 82.500l3-5" transform="translate(-1 2.500)"/>
        <path d="M92.500 79l-3-5.500M88 81l-3-5.500" transform="translate(1.500 3)"/>
      </g>
  
      <!-- Nose and mouth, a touch off-centre, with a small, calm mouth -->
      <path d="M56.500 75.500c1.500-1 7.500-1 9 0 0 2.500-2.700 5-4.500 6-1.800-1-4.500-3.500-4.500-6Z" fill="#9A2400" stroke-width="1.400"/>
      <path d="M61 81.500v3M61 84.500c-1.700 2.300-5.600 2.400-7.400.600M61 84.500c1.400 2.400 4.600 2.800 6.200 1" stroke-width="2.200"/>
  
      <!-- Whiskers: three on the left, two long and one short on the right -->
      <g stroke-width="2">
        <path d="M14 76C9 75 5.500 75.200 2.500 76.800M14.500 82C10 83.200 6.500 84.500 3.500 87M16 70c-4.500-2.500-8-3.500-11.500-3.500"/>
        <path d="M106 75c5-.8 8.500-.5 11.500 1.200M105 81.500c5 1.500 8.500 3.200 11.200 6.300M104 69.500c3-1.500 5.500-2 7.500-1.800"/>
      </g>
    </g>
</svg>
